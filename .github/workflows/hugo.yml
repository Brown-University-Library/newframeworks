# SEE ABOVE trying with scp and simple host-user-pass-port variable-secrets
# via https://github.com/marketplace/actions/scp-command-to-transfer-files
name: 'Generate and deploy'

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  deploy-website:
    runs-on: ubuntu-latest
    steps:
      - name: Do a git checkout including submodules
        uses: actions/checkout@master
        with:
          submodules: true

      - name: Generate and deploy website
        uses: Brown-University-Library/hugo-rsync-deployment@master
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_DEPLOY_USER: newframe
          PASSWORD: ${{ secrets.PASSWORD}}
          VPS_DEPLOY_HOST: 159.203.74.218
          VPS_DEPLOY_DEST: /home/newframe/www/wwwtest
        with:
          hugo-arguments: '--minify'
          rsync-arguments: '--archive --compress --xattrs --delete'
