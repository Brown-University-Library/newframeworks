name: sftp try deploy
on: 
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy file
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: newframe
          server: 159.203.74.218
          port: 22
          local_path: './*'
          remote_path: '/home/newframe/www/wwwtest/'
          sftp_only: true
          password: ${{ secrets.FTP_PASSWORD }}
