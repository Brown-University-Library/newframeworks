name: sftp try deploy
on: 
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2.6.0
        with:
          hugo-version: 'latest'
          extended: true

      # - name: Setup Node
      #   uses: actions/setup-node@v4.0.0
      #   with:
      #     node-version: '16.x'

      # - name: Install npm dependencies
      #   run: |
      #     npm install

      - name: Build
        run: hugo --minify

      - name: List output files
        run: ls public
    
      - name: Deploy file
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: newframe
          server: 159.203.74.218
          port: 22
          local_path: './*'
          remote_path: '/home/newframe/www/wwwtest/'
          sftp_only: true
          password: ${{ secrets.FTP_PASSWORD }}
