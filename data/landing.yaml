# Note: Template blocks require a 'weight' parameter so they're correctly ordered on the landing page

# Hero
hero:
  enable: true
  weight: 10
  template: hero

  title: "New Frameworks"
  subtitle: "to Preserve and Publish Born-Computational Art"

  image:
    path: "images" # path to image under configured assets directory. default 'images'
    #filename: "newframeworks.jpg" # filename of your hero image (including file extension)
    filename: "bear.png"
    alt: "Some of the New Frameworks team" # Optional but recommended
    boxShadow: false # default 'false' (excludes .svg images)
    #rounded:  # round the image corners? default 'false' (excludes .svg images)

  ctaButton:
    icon: diversity_2
    btnText: "Artists"
    url: "/docs/artists"
  cta2Button:
    icon: brush
    btnText: "Preservation Sketches"
    url: "/docs/preservation-sketches"

  info: "This project is developing new frameworks for long-term preservation and presentation of born-computational art. Preserving born-computational work can be challenging because platforms, hardware, and software are often updated or replaced, changing and even degrading how the original art is displayed. Through containerization, a portable, low-cost method of preserving and presenting the code, operating system, and text, as well as experiments with emulation and other options, our team is working to preserve the original work even if its infrastructure has been altered or discontinued. This project is in process - please check back on the model sketches we produce! We hope to complete the project in the middle of 2024."

# Disables Features Grid, do not remove
features:
  enable: false
  weight: 20


# Disables image comparison section, do not remove
image_compare:
  enable: false