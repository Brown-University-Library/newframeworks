# Features Grid
features:
  enable: true
  weight: 20

  title: Project goals
  #subtitle: Lotus Docs is a highly configurable Hugo documentation theme. Yet, with the default configuration you can deploy and publish your documentation site in a matter of minutes. Check out some core features below.

  items:
    - title: Containers
      icon: deployed_code
      description: We will work to create new and reproducible frameworks to preserve and publish works using containerization, interfaces to view the containers, documentation to describe the work, and videos to capture the work in its original instantiation.

    - title: Sharable
      icon: hub
      description: The models we create need to have repository templates and interoperable data with the largest organizations in the electronic literature field (elmcip, electronic literature organization)

    - title: Preserve
      icon: photo_album
      description: Preserve a copy of the text, where allowable by the artists, that can be used by researchers to study born-digital work for machine - actionable research. Can digital humanists study heterogeneous born - digital art utilizing distant reading ?

    - title: Support
      icon: person_add
      description: This project aims to explore reproducible models to preserve multimedia works that are otherwise difficult to preserve. This is a particularly hard problem for early career or independent artists who do not have the benefit of institutional support. This project aims to help support those artists for which there is not currently much support available.

