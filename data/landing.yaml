  title: "New Frameworks"
  subtitle: "to Preserve and Publish Born-Digital Art"

  image:
    path: "images" # path to image under configured assets directory. default 'images'
    filename: "newframeworks.jpg" # filename of your hero image (including file extension)
    alt: "Some of the New Frameworks team" # Optional but recommended
    boxShadow: true # default 'false' (excludes .svg images)
    #rounded:  # round the image corners? default 'false' (excludes .svg images)

  ctaButton:
    icon: brush
    btnText: "Artists"
    url: "/docs/artists"
  cta2Button:
    icon: diversity_2
    btnText: "Meet the team"
    url: "/docs/team"

  info: "This project will develop new frameworks for the long-term preservation and presentation of born-digital art. Preserving born-digital work can be challenging because platforms, hardware, and software are often updated or replaced, changing and even degrading how the original art is displayed. Through \"containerization\" — a portable, low-cost method of preserving and presenting the code, operating system, and text for experimental, born-digital art — future readers will still be able to view, distribute, collaborate on, and experiment with the original work even if its infrastructure has been altered or discontinued.\n

